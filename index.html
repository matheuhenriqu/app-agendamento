<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Agendamento online pelo WhatsApp — rápido e em tempo real." />
  <meta name="theme-color" content="#008069" />
  <title>WhatsApp · Agendamento Online</title>
  <!-- Google Fonts: Inter & Roboto para fidelidade ao WhatsApp Web / Mobile -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS v2 via CDN (fallback opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="web-backdrop" aria-hidden="true">
    <div class="web-topbar-stripe"></div>
  </div>

  <main class="phone" aria-label="Conversa do WhatsApp">
    <!-- Header Oficial do WhatsApp -->
    <header class="chat-header">
      <div class="header-left">
        <button type="button" class="btn-icon back-btn" aria-label="Voltar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <div class="avatar-wrap">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
        </div>

        <div class="header-info">
          <div class="header-name-row">
            <strong class="header-name">Agendamento Online</strong>
            <span class="wa-badge" title="Conta Comercial Oficial">
              <svg viewBox="0 0 18 18" width="15" height="15" fill="#00a884">
                <path d="M9 0a9 9 0 1 0 9 9A9 9 0 0 0 9 0zm4.5 6.3l-5.4 5.4a.75.75 0 0 1-1.06 0L4.5 9.16a.75.75 0 0 1 1.06-1.06l1.97 1.97 4.87-4.87a.75.75 0 0 1 1.06 1.06z"/>
              </svg>
            </span>
          </div>
          <span id="header-status" class="header-status">online</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-icon" aria-label="Chamada de vídeo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </button>
        <button type="button" class="btn-icon" aria-label="Chamada de voz">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.053 15.053 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-.99-1.12z"/>
          </svg>
        </button>
        <button type="button" class="btn-icon" aria-label="Mais opções">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="5" r="2"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <circle cx="12" cy="19" r="2"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Área de Mensagens com Doodles e Badges do WhatsApp -->
    <section id="feed" class="feed" aria-live="polite" aria-label="Mensagens">
      <!-- Badge de Criptografia do WhatsApp -->
      <div class="system-bubble encryption-note">
        <span class="lock-icon">🔒</span>
        <span>As mensagens são protegidas com a criptografia de ponta a ponta e inteligência artificial de agendamento.</span>
      </div>

      <!-- Badge de Data Centralizada "HOJE" -->
      <div class="system-bubble date-pill">
        <span>HOJE</span>
      </div>
    </section>

    <!-- Indicador de Digitação -->
    <div id="typing" class="typing-bubble" hidden aria-label="Atendente digitando">
      <div class="wa-typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Chips de Ações Rápidas (Estilo Botões Interativos WhatsApp Business) -->
    <div id="chips" class="chips-container" role="group" aria-label="Opções rápidas">
      <button type="button" class="chip" data-msg="Quais serviços e preços vocês têm?">
        💈 Ver Serviços e Preços
      </button>
      <button type="button" class="chip" data-msg="Quais horários vocês têm para amanhã?">
        📅 Horários de Amanhã
      </button>
      <button type="button" class="chip" data-msg="Quero consultar meu agendamento">
        🔍 Consultar Agendamento
      </button>
    </div>

    <!-- Barra de Digitação Oficial do WhatsApp -->
    <form id="form" class="composer-bar" autocomplete="off">
      <div class="input-pill">
        <button type="button" class="pill-btn emoji-btn" aria-label="Emojis">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8696a0" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"></path>
            <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>

        <label class="sr-only" for="input">Mensagem</label>
        <input
          id="input"
          type="text"
          placeholder="Mensagem"
          maxlength="1000"
          autofocus
        />

        <button type="button" class="pill-btn attach-btn" aria-label="Anexar arquivo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>

        <button type="button" class="pill-btn camera-btn" aria-label="Câmera">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>
      </div>

      <!-- Botão Redondo Verde do WhatsApp (Microfone ou Enviar) -->
      <button type="submit" id="btn-action" class="circle-action-btn" aria-label="Enviar mensagem">
        <svg id="icon-send" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
